[project]
name = "cold-iron-ward"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SteveAKopias", email = "attila.steve.kopias@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ciw = "ciw:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ciw"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["tests"]
pytester_example_dir = "tests/specimens"
strict = true
markers = [
    "component: uses real local binaries, no VMs",
    "kvm: needs /dev/kvm and the target host",
    "gate(id): acceptance gate V01-V10, runs only with --gate",
]
